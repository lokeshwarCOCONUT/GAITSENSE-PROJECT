<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaitSense — Single Leg Monitor</title>
    <style>
        :root { --bg: #07090f; --surface: #111820; --accent: #3de8c8; --danger: #ff4460; --text: #d0e0f0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: var(--surface); border: 1px solid #1c2636; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
        .sensor-grid { display: grid; grid-template-columns: 1fr; gap: 10px; max-width: 250px; margin: 0 auto; }
        .zone { padding: 15px; border: 1px solid #243040; border-radius: 10px; transition: 0.3s; }
        .label { display: block; font-size: 10px; color: #4a6070; text-transform: uppercase; }
        .value { font-size: 22px; font-weight: bold; }
        .btn { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>GaitSense: Single Leg</h2>
        <button class="btn" id="connectBtn">CONNECT HARDWARE</button>
    </div>
    <div class="card">
        <div class="sensor-grid">
            <div class="zone" id="z0"><span class="value" id="v0">--</span><span class="label">TOE (A0)</span></div>
            <div class="zone" id="z1"><span class="value" id="v1">--</span><span class="label">Inner Ball (A1)</span></div>
            <div class="zone" id="z2"><span class="value" id="v2">--</span><span class="label">Middle Ball (A2)</span></div>
            <div class="zone" id="z3"><span class="value" id="v3">--</span><span class="label">Outer Ball (A3)</span></div>
            <div class="zone" id="z4"><span class="value" id="v4">--</span><span class="label">Heel (A4)</span></div>
        </div>
    </div>
</body>
</html>
